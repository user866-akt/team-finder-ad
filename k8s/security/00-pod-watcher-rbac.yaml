apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-watcher
  namespace: team-finder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: team-finder
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-watcher-read-pods
  namespace: team-finder
subjects:
  - kind: ServiceAccount
    name: pod-watcher
    namespace: team-finder
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
