apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: team-finder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: amirkhubeev/team-finder-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: team-finder-config
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: team-finder-secret
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            - |
              python manage.py migrate &&
              python manage.py create_test_data &&
              python manage.py collectstatic --noinput &&
              exec gunicorn team_finder.wsgi:application --bind 0.0.0.0:8000 --workers 3
          readinessProbe:
            httpGet:
              path: /admin/login/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /admin/login/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: static-volume
              mountPath: /app/staticfiles
            - name: media-volume
              mountPath: /app/media
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: static-volume
          persistentVolumeClaim:
            claimName: static-pvc
        - name: media-volume
          persistentVolumeClaim:
            claimName: media-pvc
        - name: tmp-volume
          emptyDir: {}
